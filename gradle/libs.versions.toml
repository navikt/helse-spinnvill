[versions]
exposed = "0.61.0"
flyway = "13.1.0"
sasGradlePlugins = "20260807.0944"
tbdLibs = "20260702.1010"
testcontainers = "2.0.3"

[libraries]
exposed-core = { module = "org.jetbrains.exposed:exposed-core", version.ref= "exposed" }
exposed-dao = { module = "org.jetbrains.exposed:exposed-dao", version.ref= "exposed" }
exposed-java-time = { module = "org.jetbrains.exposed:exposed-java-time", version.ref= "exposed" }
exposed-jdbc = { module = "org.jetbrains.exposed:exposed-jdbc", version.ref= "exposed" }
exposed-json = { module = "org.jetbrains.exposed:exposed-json", version.ref= "exposed" }

flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
flyway-postgres = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }

hikari = "com.zaxxer:HikariCP:7.1.0"

jackson-jsr310 = { group = "com.fasterxml.jackson.datatype", name = "jackson-datatype-jsr310" }
jackson-kotlin = { group = "com.fasterxml.jackson.module", name = "jackson-module-kotlin" }

kotliquery = "com.github.seratch:kotliquery:1.9.1"

logback-classic = "ch.qos.logback:logback-classic:1.6.1"
logback-logstashEncoder = "net.logstash.logback:logstash-logback-encoder:9.0"
micrometer-prometheus = "io.micrometer:micrometer-registry-prometheus:1.16.1"
postgresJdbcDriver = "org.postgresql:postgresql:42.7.13"
postgresSocketFactory = "com.google.cloud.sql:postgres-socket-factory:1.29.0"
rapidsAndRivers = "com.github.navikt:rapids-and-rivers:2025110410541762250064.d7e58c3fad81"
slf4j-api = "org.slf4j:slf4j-api:2.0.18"

tbdLibs-rapidsAndRiversTest = { module = "com.github.navikt.tbd-libs:rapids-and-rivers-test", version.ref = "tbdLibs" }

testcontainers-postgres = { module = "org.testcontainers:testcontainers-postgresql", version.ref = "testcontainers" }

unleash-client = "io.getunleash:unleash-client-java:12.2.3"

[bundles]
exposed = [
    "exposed-core",
    "exposed-dao",
    "exposed-java-time",
    "exposed-jdbc",
    "exposed-json"
]
flyway-postgres = [
    "flyway-core",
    "flyway-postgres"
]
jackson = [
    "jackson-jsr310",
    "jackson-kotlin",
]
logback = [
    "logback-classic",
    "logback-logstashEncoder",
]

[plugins]
sas-deployable = { id = "no.nav.helse.sas.sas-deployable", version.ref = "sasGradlePlugins" }
sas-kotlin = { id = "no.nav.helse.sas.sas-kotlin", version.ref = "sasGradlePlugins" }
sas-root = { id = "no.nav.helse.sas.sas-root", version.ref = "sasGradlePlugins" }
